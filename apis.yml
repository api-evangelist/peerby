aid: peerby
name: Peerby
description: >-
  Peerby is a Dutch peer-to-peer sharing platform that lets neighbors borrow and
  rent everyday goods from one another instead of buying them new. Through its
  website and mobile apps, members request or list items such as tools, party and
  event equipment, electronics, bicycles, and household goods, then arrange local
  pickup and return. Positioned as an affordable, convenient, and more sustainable
  alternative to ownership, Peerby aims to reduce consumption and waste by unlocking
  the underused items already sitting in people's homes. Backed by Techstars, it was
  added to the API Evangelist network as a portfolio lead. Peerby operates a consumer
  single-page web application and native apps; it does not publish a public
  developer/API program, OpenAPI definitions, SDKs, or a .well-known discovery
  surface at this time.
